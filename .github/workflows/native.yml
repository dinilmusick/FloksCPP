name: FloksCPP native package and Frnl integration
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, compiler: gcc, mode: Debug}
          - {os: ubuntu-latest, compiler: gcc, mode: Release}
          - {os: ubuntu-latest, compiler: clang, mode: Debug}
          - {os: ubuntu-latest, compiler: clang, mode: Release}
          - {os: macos-latest, compiler: clang, mode: Release}
          - {os: windows-latest, compiler: msvc, mode: Release}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install real FrnlCPP at immutable verified Wave 2 revision
        shell: bash
        run: |
          git clone --quiet https://github.com/dinilmusick/FrnlCPP.git "$RUNNER_TEMP/FrnlCPP"
          git -C "$RUNNER_TEMP/FrnlCPP" checkout --quiet 536a46228a8fde46fddc95447ca264fa2ed5fd6b
          cmake -S "$RUNNER_TEMP/FrnlCPP" -B "$RUNNER_TEMP/frnl-build" -DBUILD_TESTING=OFF -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/frnl-prefix"
          cmake --build "$RUNNER_TEMP/frnl-build" --config Release --parallel 2
          cmake --install "$RUNNER_TEMP/frnl-build" --config Release
      - name: Configure FloksCPP (real FrnlCPP integration enabled)
        shell: bash
        run: |
          if [[ '${{ matrix.compiler }}' == 'gcc' ]]; then export CXX=g++; fi
          if [[ '${{ matrix.compiler }}' == 'clang' ]]; then export CXX=clang++; fi
          cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.mode }} -DBUILD_TESTING=ON -DFLOKSCPP_STRICT_WARNINGS=ON -DFLOKSCPP_REQUIRE_FRNL=ON -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/frnl-prefix" -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/floks-prefix"
      - name: Build and test
        shell: bash
        run: |
          cmake --build build --config ${{ matrix.mode }} --parallel 2
          ctest --test-dir build -C ${{ matrix.mode }} --output-on-failure
      - name: Installed external consumer
        shell: bash
        run: |
          cmake --install build --config ${{ matrix.mode }}
          cmake -S consumer -B consumer-build -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/floks-prefix;$RUNNER_TEMP/frnl-prefix"
          cmake --build consumer-build --config ${{ matrix.mode }}
          ctest --test-dir consumer-build -C ${{ matrix.mode }} --output-on-failure
  sanitizers:
    runs-on: ubuntu-latest
    strategy:
      matrix: {compiler: [g++, clang++]}
    steps:
      - uses: actions/checkout@v4
      - name: ASan and UBSan (native core)
        shell: bash
        run: |
          CXX=${{ matrix.compiler }} cmake -S . -B sanitize -DCMAKE_BUILD_TYPE=Debug -DFLOKSCPP_SANITIZERS=ON -DBUILD_TESTING=ON
          cmake --build sanitize --parallel 2
          ctest --test-dir sanitize --output-on-failure
